name: SprintSync Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI Pipeline: Checks, Migrations & Full Test Suite
  # ============================================================================
  backend-ci:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_management_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: "ci-testing-secret-key-not-for-production-use"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/project_management_db"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_TASK_ALWAYS_EAGER: "True"
      STRIPE_SECRET_KEY: "sk_test_ci_mock_secret_key"
      STRIPE_PUBLISHABLE_KEY: "pk_test_ci_mock_publishable_key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_webhook_secret"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Integrity Check
        run: |
          python backend/manage.py check

      - name: Verify Migration Consistency
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        run: |
          python backend/manage.py test apps.accounts apps.workspaces apps.projects apps.boards apps.issues apps.sprints apps.notifications apps.webhooks apps.billing apps.core

  # ============================================================================
  # 2. Frontend CI Pipeline: Dependencies & Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend Client Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Vite Production Assets
        env:
          VITE_API_URL: ""
        run: |
          npm run build --prefix frontend

  # ============================================================================
  # 3. Docker Compose Configuration Validation
  # ============================================================================
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Docker Container Images
        run: |
          docker compose build

